name: Integration testing

on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Synchronize 
        run: uv sync
      - name: Run linter
        run: uv run ruff check app/ test/

  test:
    name: Pytest 
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      TOKEN_URL: ${{ secrets.TOKEN_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6
      - name: Python setup
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Synchronize
        run: uv sync
      - name: Run tests
        run: uv run pytest test/ -v --cov=app --cov-report=term-missing

  docker: 
    name: Docker testing 
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }} 
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }} 
      CLIENT_ID: ${{ secrets.CLIENT_ID }} 
      SECRET_KEY: ${{ secrets.SECRET_KEY }} 
      AUTH_URL: ${{ secrets.AUTH_URL }} 
      TOKEN_URL: ${{ secrets.TOKEN_URL }} 
      API_BASE_URL: ${{ secrets.API_BASE_URL }} 
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }} 
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6
      - name: Build docker image
        run: docker build --build-arg FOO=$FOO -t poc-recommendation-system .
      - name: Run Docker container test
        run: | 
          docker run --rm \ 
          -e PYTHONUNBUFFERED=1 \
          -e DATABASE_URI=${{ secrets.DATABASE_URI }} \
          -e CLIENT_SECRET=${{ secrets.CLIENT_SECRET }} \
          -e CLIENT_ID=${{ secrets.CLIENT_ID }} \
          -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
          -e AUTH_URL=${{ secrets.AUTH_URL }} \
          -e TOKEN_URL=${{ secrets.TOKEN_URL }} \
          -e API_BASE_URL=${{ secrets.API_BASE_URL }} \
          -e REDIRECT_URI=${{ secrets.REDIRECT_URI }} \
           poc-recommendation-system uv run pytest test/ -v --cov=app --cov-report=term-missing

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    steps:
      - name: All checks passed
        run: echo "All CI checks completed successfully!"